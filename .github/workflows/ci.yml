name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install packages
      run: >
        sudo apt-get update && sudo apt-get install -y
        pkg-config libleveldb-dev libsnappy-dev libcurl4-openssl-dev
        libssl-dev libncurses-dev libcjson-dev
    - name: build (debug)
      run: make
    - name: build (strict warnings)
      run: make clean && make STRICT=1
    - name: build (release)
      run: make clean && make BUILD=release
    - name: fuzz parsers
      run: make check
    - name: fuzz parsers (asan+ubsan)
      run: make clean && make BUILD=asan+ubsan check FUZZ_ITERS=20000
